<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ClimateWire</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,300;9..144,700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0d0d0f;--surface:#141417;--surface2:#1c1c20;--border:#27272c;
    --ink:#e2e2e6;--ink2:#8a8a94;--mono:'IBM Plex Mono',monospace;
    --display:'Fraunces',serif;
    --drought:#e8892a;--fire:#e84a2a;--heat:#d4a017;--water:#3b82f6;
    --accent:var(--drought);
  }
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:13px;-webkit-font-smoothing:antialiased}

  /* ── Layout ── */
  #app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  #topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;gap:12px;flex-wrap:wrap}
  #main{display:flex;flex:1;overflow:hidden}
  #sidebar{width:300px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
  #map-wrap{flex:1;position:relative}
  #map{width:100%;height:100%}
  #detail{width:280px;flex-shrink:0;border-left:1px solid var(--border);display:none;flex-direction:column;overflow:hidden}
  #detail.open{display:flex}

  /* ── Topbar ── */
  .wordmark{font-family:var(--display);font-weight:300;font-size:17px;letter-spacing:-0.02em;color:var(--ink)}
  .wordmark span{color:var(--accent)}
  .tagline{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink2);margin-top:1px}
  .wire-tabs{display:flex;gap:4px}
  .wire-tab{background:transparent;border:1px solid transparent;color:var(--ink2);font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:4px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .15s}
  .wire-tab:hover{color:var(--ink);border-color:var(--border)}
  .wire-tab.active{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .wire-tab .badge{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--surface2)}
  .wire-tab.active .badge{background:color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent)}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ── Stats ── */
  #statsbar{padding:8px 16px;border-bottom:1px solid var(--border);display:flex;gap:20px;flex-shrink:0;background:var(--surface)}
  .stat-item .label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
  .stat-item .value{font-size:13px;color:var(--accent);font-weight:500;margin-top:1px}

  /* ── Feed ── */
  #feed-header{padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
  #feed-header .label{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
  #feed-header .count{font-size:11px;color:var(--accent);margin-top:2px}
  #feed{flex:1;overflow-y:auto}
  #feed::-webkit-scrollbar{width:3px}
  #feed::-webkit-scrollbar-track{background:var(--surface)}
  #feed::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .article{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;border-left:2px solid transparent}
  .article:hover{background:rgba(255,255,255,.03)}
  .article.selected{background:rgba(255,255,255,.05);border-left-color:var(--accent)}
  .article-title{font-size:11px;line-height:1.45;color:var(--ink2);margin-bottom:6px}
  .article.selected .article-title{color:var(--ink)}
  .article-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .article-source{font-size:10px;color:var(--ink2);opacity:.6}
  .article-loc{font-size:9px;padding:1px 6px;border-radius:3px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
  .article-time{font-size:9px;color:var(--ink2);opacity:.5;margin-left:auto}
  .no-articles{padding:32px 14px;text-align:center;color:var(--ink2);font-size:11px}

  /* ── Map ── */
  .leaflet-container{background:#1a1a2e!important}
  /* tile filter removed — using OSM default */
  .leaflet-control-zoom a{background:var(--surface2)!important;color:var(--ink)!important;border-color:var(--border)!important}
  .leaflet-popup-content-wrapper{background:var(--surface2)!important;color:var(--ink)!important;border:1px solid var(--border)!important;border-radius:4px!important;box-shadow:0 8px 32px rgba(0,0,0,.7)!important}
  .leaflet-popup-tip{background:var(--surface2)!important}
  .leaflet-attribution-flag{display:none!important}
  .leaflet-control-attribution{background:rgba(13,13,15,.7)!important;color:var(--ink2)!important;font-size:9px!important}
  .map-overlay{position:absolute;bottom:12px;left:12px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);background:rgba(13,13,15,.8);padding:4px 8px;border-radius:3px;backdrop-filter:blur(4px);z-index:1000;pointer-events:none}

  /* ── Detail panel ── */
  #detail-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
  #detail-wire{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  #detail-close{background:none;border:none;color:var(--ink2);cursor:pointer;font-size:14px;padding:0;line-height:1}
  #detail-close:hover{color:var(--ink)}
  #detail-body{flex:1;overflow-y:auto;padding:14px}
  #detail-body::-webkit-scrollbar{width:3px}
  #detail-body::-webkit-scrollbar-track{background:var(--surface)}
  #detail-body::-webkit-scrollbar-thumb{background:var(--border)}
  #detail-title{font-family:var(--display);font-weight:300;font-size:15px;line-height:1.4;margin-bottom:12px}
  #detail-snippet{font-size:11px;line-height:1.6;color:var(--ink2);margin-bottom:14px}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .detail-field .field-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);opacity:.6;margin-bottom:2px}
  .detail-field .field-value{font-size:10px;color:var(--ink2)}
  .detail-coords{font-size:9px;color:var(--ink2);background:var(--surface2);padding:6px 8px;border-radius:3px;margin-bottom:14px;font-family:var(--mono)}
  #detail-link{display:block;text-align:center;padding:8px;border-radius:4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;transition:opacity .15s;border:1px solid}
  #detail-link:hover{opacity:.8}

  /* ── Loading ── */
  #loader{position:absolute;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:8px}
  #loader .spin{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loader .load-text{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
</style>
</head>
<body>
<div id="app">

  <!-- Topbar -->
  <div id="topbar">
    <div>
      <div class="wordmark">Climate<span>Wire</span></div>
      <div class="tagline">Live hazard intelligence</div>
    </div>
    <div class="wire-tabs" id="wire-tabs"></div>
    <div style="display:flex;align-items:center;gap:6px">
      <div class="live-dot" id="live-dot"></div>
      <span style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)">Live</span>
    </div>
  </div>

  <!-- Stats -->
  <div id="statsbar">
    <div class="stat-item"><div class="label">Articles</div><div class="value" id="stat-total">—</div></div>
    <div class="stat-item"><div class="label">Mapped</div><div class="value" id="stat-mapped">—</div></div>
    <div class="stat-item"><div class="label">Sources</div><div class="value" id="stat-sources">—</div></div>
    <div class="stat-item"><div class="label">Updated</div><div class="value" id="stat-updated" style="font-size:11px">—</div></div>
  </div>

  <!-- Main -->
  <div id="main">

    <!-- Sidebar feed -->
    <div id="sidebar">
      <div id="feed-header">
        <div class="label">Latest dispatches</div>
        <div class="count" id="feed-count">0 articles</div>
      </div>
      <div id="feed"></div>
    </div>

    <!-- Map -->
    <div id="map-wrap">
      <div id="loader">
        <div class="spin"></div>
        <div class="load-text">Loading wire data</div>
      </div>
      <div id="map"></div>
      <div class="map-overlay" id="map-overlay"></div>
    </div>

    <!-- Detail panel -->
    <div id="detail">
      <div id="detail-header">
        <div id="detail-wire"></div>
        <button id="detail-close">✕</button>
      </div>
      <div id="detail-body">
        <div id="detail-title"></div>
        <div id="detail-snippet"></div>
        <div class="detail-grid" id="detail-grid"></div>
        <div class="detail-coords" id="detail-coords" style="display:none"></div>
        <a id="detail-link" href="#" target="_blank" rel="noopener">Read full article →</a>
      </div>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Config ──────────────────────────────────────────────────────────────────
const GITHUB_RAW = 'https://raw.githubusercontent.com/rmkenv/climatewire/main/data'

const WIRES = [
  { id:'drought', label:'Drought',      emoji:'🌵', color:'#e8892a', tagline:'Water shortage & drought monitor' },
  { id:'fire',    label:'Wildfire',     emoji:'🔥', color:'#e84a2a', tagline:'Active fire & evacuation alerts' },
  { id:'heat',    label:'Extreme Heat', emoji:'☀️', color:'#d4a017', tagline:'Heat emergency & public health'  },
  { id:'water',   label:'Water',        emoji:'💧', color:'#3b82f6', tagline:'Water restriction & scarcity'    },
]

// State-centroid fallback for unmapped articles
const STATE_CENTROIDS = {
  alabama:[32.81,-86.79],alaska:[61.37,-152.4],arizona:[33.73,-111.43],
  arkansas:[34.97,-92.37],california:[36.12,-119.68],colorado:[39.06,-105.31],
  connecticut:[41.60,-72.76],delaware:[39.32,-75.51],florida:[27.77,-81.69],
  georgia:[33.04,-83.64],hawaii:[21.09,-157.5],idaho:[44.24,-114.48],
  illinois:[40.35,-88.99],indiana:[39.85,-86.26],iowa:[42.01,-93.21],
  kansas:[38.53,-96.73],kentucky:[37.67,-84.67],louisiana:[31.17,-91.87],
  maine:[44.69,-69.38],maryland:[39.06,-76.80],massachusetts:[42.23,-71.53],
  michigan:[43.33,-84.54],minnesota:[45.69,-93.9],mississippi:[32.74,-89.68],
  missouri:[38.46,-92.29],montana:[46.92,-110.45],nebraska:[41.13,-98.27],
  nevada:[38.31,-117.06],['new hampshire']:[43.45,-71.56],['new jersey']:[40.30,-74.52],
  ['new mexico']:[34.84,-106.25],['new york']:[42.17,-74.95],
  ['north carolina']:[35.63,-79.81],['north dakota']:[47.53,-99.78],
  ohio:[40.39,-82.76],oklahoma:[35.57,-96.93],oregon:[44.57,-122.07],
  pennsylvania:[40.59,-77.21],['rhode island']:[41.68,-71.51],
  ['south carolina']:[33.86,-80.95],['south dakota']:[44.30,-99.44],
  tennessee:[35.75,-86.69],texas:[31.05,-97.56],utah:[40.15,-111.86],
  vermont:[44.05,-72.71],virginia:[37.77,-78.17],washington:[47.40,-121.49],
  ['west virginia']:[38.49,-80.95],wisconsin:[44.27,-89.62],wyoming:[42.76,-107.30],
  // water bodies / regions
  ['lake mead']:[36.02,-114.74],['lake powell']:[37.07,-111.26],
  ['colorado river']:[36.11,-113.03],['navajo nation']:[36.51,-108.67],
}

function inferCoords(props) {
  const text = ((props.title || '') + ' ' + (props.mention_text || '') + ' ' + (props.osm_display || '')).toLowerCase()
  for (const [name, coords] of Object.entries(STATE_CENTROIDS)) {
    if (text.includes(name)) return coords
  }
  return null
}

// ── State ────────────────────────────────────────────────────────────────────
let activeWire   = 'drought'
let allData      = {}   // wire -> geojson
let selectedId   = null
let map          = null
let markerLayer  = null
let counts       = {}

// ── Map init ─────────────────────────────────────────────────────────────────
function initMap() {
  map = L.map('map', { center:[39.5,-98.35], zoom:4, zoomControl:true, attributionControl:true })
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom:19,
    attribution:'© <a href="https://openstreetmap.org">OpenStreetMap</a>'
  }).addTo(map)
  markerLayer = L.layerGroup().addTo(map)
}

// ── Fetch ─────────────────────────────────────────────────────────────────────
async function fetchWire(wireId) {
  const url = `${GITHUB_RAW}/${wireId}.geojson`
  try {
    const r = await fetch(url)
    if (!r.ok) throw new Error(r.status)
    return await r.json()
  } catch(e) {
    console.error('fetch failed', wireId, e)
    return null
  }
}

async function loadAll() {
  const results = await Promise.all(WIRES.map(w => fetchWire(w.id)))
  WIRES.forEach((w, i) => {
    if (results[i]) {
      allData[w.id] = results[i]
      counts[w.id] = results[i].features?.length ?? 0
    } else {
      counts[w.id] = 0
    }
  })
  renderTabs()
  render()
  document.getElementById('loader').style.display = 'none'
}

// ── Render tabs ───────────────────────────────────────────────────────────────
function renderTabs() {
  const wire = WIRES.find(w => w.id === activeWire)
  document.documentElement.style.setProperty('--accent', wire.color)

  const container = document.getElementById('wire-tabs')
  container.innerHTML = ''
  WIRES.forEach(w => {
    const btn = document.createElement('button')
    btn.className = 'wire-tab' + (w.id === activeWire ? ' active' : '')
    btn.style.setProperty('--accent', w.color)
    btn.innerHTML = `<span>${w.emoji}</span><span>${w.label}</span><span class="badge">${counts[w.id] ?? '…'}</span>`
    btn.onclick = () => { activeWire = w.id; selectedId = null; render() }
    container.appendChild(btn)
  })
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const wire = WIRES.find(w => w.id === activeWire)
  document.documentElement.style.setProperty('--accent', wire.color)
  renderTabs()

  const geoData = allData[activeWire]
  const features = geoData?.features ?? []
  const articles = features.map(f => f.properties)

  // Stats
  const mapped = articles.filter(a => a.geocoded).length
  const sources = new Set(articles.map(a => a.source).filter(Boolean)).size
  const updated = geoData?.metadata?.last_updated
    ? new Date(geoData.metadata.last_updated).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})
    : '—'

  document.getElementById('stat-total').textContent   = articles.length
  document.getElementById('stat-mapped').textContent  = mapped
  document.getElementById('stat-sources').textContent = sources
  document.getElementById('stat-updated').textContent = updated
  document.getElementById('feed-count').textContent   = `${articles.length} articles`
  document.getElementById('map-overlay').textContent  = wire.tagline

  renderFeed(articles, wire)
  renderMarkers(features, wire)
}

// ── Feed ──────────────────────────────────────────────────────────────────────
function timeAgo(str) {
  if (!str) return ''
  try {
    const h = Math.floor((Date.now() - new Date(str)) / 3600000)
    if (h < 1)  return 'just now'
    if (h < 24) return `${h}h ago`
    return `${Math.floor(h/24)}d ago`
  } catch { return '' }
}

function renderFeed(articles, wire) {
  const feed = document.getElementById('feed')
  const sorted = [...articles].sort((a,b) =>
    new Date(b.fetched_at) - new Date(a.fetched_at)
  )

  if (!sorted.length) {
    feed.innerHTML = `<div class="no-articles">${wire.emoji}<br><br>No articles yet</div>`
    return
  }

  feed.innerHTML = sorted.map(a => {
    const isSelected = selectedId === a.article_id
    const locBadge = a.mention_text
      ? `<span class="article-loc">📍 ${a.mention_text}</span>`
      : ''
    return `
      <div class="article ${isSelected ? 'selected' : ''}"
           style="${isSelected ? `border-left-color:${wire.color}` : ''}"
           data-id="${a.article_id}">
        <div class="article-title">${a.title}</div>
        <div class="article-meta">
          <span class="article-source">${a.source || ''}</span>
          ${locBadge}
          <span class="article-time">${timeAgo(a.fetched_at)}</span>
        </div>
      </div>`
  }).join('')

  feed.querySelectorAll('.article').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.id
      const article = articles.find(a => a.article_id === id)
      if (article) selectArticle(article)
    })
  })
}

// ── Markers ───────────────────────────────────────────────────────────────────
function renderMarkers(features, wire) {
  markerLayer.clearLayers()

  features.forEach(f => {
    const props = f.properties

    // Use geocoded coords if available, otherwise infer from text
    let lat, lon
    if (f.geometry?.coordinates) {
      ;[lon, lat] = f.geometry.coordinates
    } else {
      const inferred = inferCoords(props)
      if (!inferred) return
      ;[lat, lon] = inferred
    }

    const isSelected = selectedId === props.article_id
    const size = isSelected ? 13 : 8
    const color = wire.color

    const icon = L.divIcon({
      className: '',
      html: `<div style="
        width:${size}px;height:${size}px;
        background:${color};border-radius:50%;
        border:${isSelected ? '2px solid #fff' : `1px solid ${color}55`};
        box-shadow:0 0 ${isSelected ? 10 : 4}px ${color}88;
      "></div>`,
      iconSize:[size,size], iconAnchor:[size/2,size/2]
    })

    const marker = L.marker([lat,lon], { icon })
    marker.on('click', () => selectArticle(props))
    marker.bindTooltip(props.title, {
      direction:'top', offset:[0,-6],
      className:'',
      opacity:0.95
    })
    markerLayer.addLayer(marker)
  })
}

// ── Detail panel ──────────────────────────────────────────────────────────────
function selectArticle(props) {
  selectedId = props.article_id
  const wire = WIRES.find(w => w.id === activeWire)

  // Re-render feed selection
  document.querySelectorAll('.article').forEach(el => {
    const sel = el.dataset.id === selectedId
    el.classList.toggle('selected', sel)
    el.style.borderLeftColor = sel ? wire.color : 'transparent'
    if (sel) el.scrollIntoView({ block:'nearest' })
  })

  // Re-render markers
  const geoData = allData[activeWire]
  if (geoData) renderMarkers(geoData.features, wire)

  // Populate detail
  document.getElementById('detail-wire').textContent   = `${wire.emoji} ${wire.label}`
  document.getElementById('detail-wire').style.color   = wire.color
  document.getElementById('detail-title').textContent  = props.title
  document.getElementById('detail-snippet').textContent = props.snippet || ''
  document.getElementById('detail-snippet').style.display = props.snippet ? 'block' : 'none'

  const fields = [
    { label:'Source',    value: props.source || '—' },
    { label:'Location',  value: props.mention_text || '—' },
    { label:'Published', value: props.published_at || '—' },
    { label:'Event',     value: props.event_type || '—' },
  ]
  document.getElementById('detail-grid').innerHTML = fields.map(f => `
    <div class="detail-field">
      <div class="field-label">${f.label}</div>
      <div class="field-value">${f.value}</div>
    </div>
  `).join('')

  const coordEl = document.getElementById('detail-coords')
  if (props.lat && props.lon) {
    coordEl.style.display = 'block'
    coordEl.textContent = `${Number(props.lat).toFixed(4)}°N  ${Math.abs(Number(props.lon)).toFixed(4)}°W`
    if (props.osm_display) coordEl.textContent += `\n${props.osm_display}`
  } else {
    coordEl.style.display = 'none'
  }

  const link = document.getElementById('detail-link')
  link.href = props.url || '#'
  link.style.background = `color-mix(in srgb,${wire.color} 12%,transparent)`
  link.style.color = wire.color
  link.style.borderColor = `color-mix(in srgb,${wire.color} 35%,transparent)`

  document.getElementById('detail').classList.add('open')
}

document.getElementById('detail-close').addEventListener('click', () => {
  selectedId = null
  document.getElementById('detail').classList.remove('open')
  const wire = WIRES.find(w => w.id === activeWire)
  const geoData = allData[activeWire]
  if (geoData) renderMarkers(geoData.features, wire)
  document.querySelectorAll('.article').forEach(el => {
    el.classList.remove('selected')
    el.style.borderLeftColor = 'transparent'
  })
})

// ── Boot ──────────────────────────────────────────────────────────────────────
initMap()
loadAll()

// Auto-refresh every 15 min
setInterval(async () => {
  const wire = WIRES.find(w => w.id === activeWire)
  const data = await fetchWire(activeWire)
  if (data) { allData[activeWire] = data; counts[activeWire] = data.features?.length ?? 0 }
  render()
  document.getElementById('live-dot').style.background = '#4ade80'
  setTimeout(() => document.getElementById('live-dot').style.background = wire.color, 1000)
}, 15 * 60 * 1000)
</script>
</body>
</html>
